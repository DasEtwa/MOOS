name: Gateway

on:
  push:
    branches:
      - "**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "host/moos-gateway/**"
      - "host/moosd.py"
      - "host/moos_protocol.py"
      - "host/moos_runtime.py"
      - "host/moos_admin_installer.py"
      - "scripts/build-gateway.sh"
      - "scripts/build-admin-release.py"
      - "scripts/moos"
      - "scripts/moosd.py"
      - "scripts/run-instance.sh"
      - "scripts/run-qemu.sh"
      - "scripts/setup-control-plane.sh"
      - "scripts/setup-gateway.sh"
      - "scripts/setup-runtime-user.sh"
      - "scripts/stage-instance.sh"
      - "systemd/moos-gateway.service"
      - "systemd/moosd.service"
      - "systemd/moosd.socket"
      - "tests/gateway_*.py"
      - "tests/fixtures/gateway-v1-contract.json"
      - "tests/protocol_contract.py"
      - "tests/moosd_protocol.py"
      - "tests/control_plane_installer.py"
      - "tests/admin_release.py"
      - "tests/release_profile.py"
      - "tests/runtime_control.py"
      - "tests/runtime_isolation.py"
      - "configs/control-plane-manifest.sha256"
      - "HOST_GUEST_ISOLATION.md"
      - "ADMIN_RELEASES.md"
      - "GATEWAY.md"
      - "README.md"
      - "STEPS.md"
      - "PROTOCOL.md"
      - "ios/MOOSApp/MOOSApp/Protocol/MOOSGatewayV1.swift"
      - "ios/MOOSApp/MOOSAppTests/MOOSAppTests.swift"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "host/moos-gateway/**"
      - "host/moosd.py"
      - "host/moos_protocol.py"
      - "host/moos_runtime.py"
      - "host/moos_admin_installer.py"
      - "scripts/build-gateway.sh"
      - "scripts/build-admin-release.py"
      - "scripts/moos"
      - "scripts/moosd.py"
      - "scripts/run-instance.sh"
      - "scripts/run-qemu.sh"
      - "scripts/setup-control-plane.sh"
      - "scripts/setup-gateway.sh"
      - "scripts/setup-runtime-user.sh"
      - "scripts/stage-instance.sh"
      - "systemd/moos-gateway.service"
      - "systemd/moosd.service"
      - "systemd/moosd.socket"
      - "tests/gateway_*.py"
      - "tests/fixtures/gateway-v1-contract.json"
      - "tests/protocol_contract.py"
      - "tests/moosd_protocol.py"
      - "tests/control_plane_installer.py"
      - "tests/admin_release.py"
      - "tests/release_profile.py"
      - "tests/runtime_control.py"
      - "tests/runtime_isolation.py"
      - "configs/control-plane-manifest.sha256"
      - "HOST_GUEST_ISOLATION.md"
      - "ADMIN_RELEASES.md"
      - "GATEWAY.md"
      - "README.md"
      - "STEPS.md"
      - "PROTOCOL.md"
      - "ios/MOOSApp/MOOSApp/Protocol/MOOSGatewayV1.swift"
      - "ios/MOOSApp/MOOSAppTests/MOOSAppTests.swift"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default 1.97.1
          rustc --version --verbose
          cargo --version

      - name: Format, lint, and test the Rust Gateway
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Build the canonical release binaries
        run: |
          ./scripts/build-gateway.sh
          ./scripts/build-admin-release.py \
            --output "$RUNNER_TEMP/moos-admin-release.tar"

      - name: Compile Python development tools and validate shell
        run: |
          python3 -m py_compile \
            host/moos_admin_installer.py \
            scripts/build-admin-release.py \
            tests/gateway_auth.py \
            tests/gateway_protocol.py \
            tests/protocol_contract.py \
            tests/moosd_protocol.py \
            tests/admin_release.py \
            tests/control_plane_installer.py \
            tests/release_profile.py \
            tests/runtime_control.py \
            tests/runtime_isolation.py
          sh -n scripts/build-gateway.sh scripts/setup-control-plane.sh scripts/setup-gateway.sh

      - name: Test cross-client authentication and host integration
        run: |
          python3 tests/gateway_auth.py
          python3 tests/gateway_protocol.py

      - name: Test shared protocol and host policy boundaries
        run: |
          python3 tests/protocol_contract.py
          python3 tests/moosd_protocol.py
          python3 tests/admin_release.py
          python3 tests/control_plane_installer.py
          python3 tests/release_profile.py
          python3 tests/runtime_control.py
          python3 tests/runtime_isolation.py
