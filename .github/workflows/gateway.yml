name: Gateway

on:
  push:
    branches:
      - "**"
    paths:
      - "host/moos_gateway*.py"
      - "host/moosd.py"
      - "host/moos_protocol.py"
      - "scripts/moos-gateway*.py"
      - "scripts/setup-gateway.sh"
      - "systemd/moos-gateway.service"
      - "tests/gateway_*.py"
      - "tests/moosd_protocol.py"
      - "tests/runtime_isolation.py"
      - "GATEWAY.md"
      - "PROTOCOL.md"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "host/moos_gateway*.py"
      - "host/moosd.py"
      - "host/moos_protocol.py"
      - "scripts/moos-gateway*.py"
      - "scripts/setup-gateway.sh"
      - "systemd/moos-gateway.service"
      - "tests/gateway_*.py"
      - "tests/moosd_protocol.py"
      - "tests/runtime_isolation.py"
      - "GATEWAY.md"
      - "PROTOCOL.md"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile Python and validate shell
        run: |
          python3 -m py_compile \
            host/moos_gateway.py \
            host/moos_gateway_auth.py \
            scripts/moos-gateway.py \
            scripts/moos-gateway-device.py
          sh -n scripts/setup-gateway.sh

      - name: Test device authentication and Gateway forwarding
        run: |
          python3 tests/gateway_auth.py
          python3 tests/gateway_protocol.py

      - name: Test shared protocol and host policy boundaries
        run: |
          python3 tests/protocol_contract.py
          python3 tests/moosd_protocol.py
          python3 tests/runtime_isolation.py
