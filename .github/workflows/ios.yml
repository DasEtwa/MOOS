name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "tests/ios_client.py"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "tests/ios_client.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Validate client boundaries
        run: python3 tests/ios_client.py

      - name: Build for iPhone simulator
        run: |
          xcodebuild \
            -project ios/MOOSApp/MOOSApp.xcodeproj \
            -scheme MOOSApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath "$RUNNER_TEMP/MOOSDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing

      - name: Run unit tests
        run: |
          xcodebuild \
            -project ios/MOOSApp/MOOSApp.xcodeproj \
            -scheme MOOSApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath "$RUNNER_TEMP/MOOSDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test-without-building
