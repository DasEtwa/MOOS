image installer-boot.vfat {
    vfat {
        extraargs = "--invariant -i 4d4f4f54"
        file EFI { image = "efi-part/EFI" }
        file boot/grub/grub.cfg { image = "installer-grub.cfg" }
        file bzImage { image = "bzImage" }
        file rootfs.cpio.gz { image = "rootfs.cpio.gz" }
        file payload { image = "payload" }
    }
    size = 128M
}
image moos-native-installer-x86_64.img {
    size = 131M
    hdimage {
        partition-table-type = "gpt"
        disk-uuid = "4d4f4f53-0000-4000-9000-000000000000"
        align = 1M
    }
    partition BIOS_GRUB {
        partition-type-uuid = "21686148-6449-6e6f-744e-656564454649"
        partition-uuid = "4d4f4f53-0000-4000-9000-000000000001"
        offset = 1M
        size = 1M
    }
    partition INSTALLER {
        partition-type-uuid = U
        partition-uuid = "4d4f4f53-0000-4000-9000-000000000002"
        image = "installer-boot.vfat"
    }
}
