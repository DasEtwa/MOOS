[package]
name = "moos-gateway"
version = "0.1.0"
description = "Authenticated Tailscale-only gateway for the MOOS control plane"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "=0.23.1"
getrandom = { version = "=0.4.3", features = ["std"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
nix = { version = "=0.31.3", default-features = false, features = ["fs", "net", "socket", "user"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
subtle = "=2.6.1"
time = { version = "=0.3.55", default-features = false, features = ["formatting", "std"] }
uuid = { version = "=1.24.1", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[lints]
workspace = true
